[project]
name = "ha-assist-timers"
version = "0.1.0"
description = "Home Assistant Assist timers on your dashboard: see, set, pause and dismiss voice satellite timers without firmware changes"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "yamllint>=1.35.0",
    "pytest-homeassistant-custom-component",
    # rest integration requirements (homeassistant/components/rest/manifest.json)
    "jsonpath-python==1.1.6",
    "xmltodict==1.0.4",
    # assist_timer_ring sends ESPHome API commands; the version HA 2026.10 pins (production
    # 2026.9.4 has 46.2.0 with the same media_player_command signature)
    "aioesphomeapi==46.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
extend-exclude = [".venv"]
