# Lovelace raw card YAML. Requires custom:button-card v6+ and assist_timers.yaml.
# Lists every Assist timer of every satellite, read from HA (sensor.assist_timers).
# The sensor is polled every 5 s; seconds count down in the browser in between.
# Finished timers show as "valmis" until dismissed on the satellite (sensor.assist_timers_finished).
# Colours come from the theme, so light and dark themes both work.
type: custom:button-card
entity: sensor.assist_timers
triggers_update: all
update_timer: 1000
show_icon: false
show_name: false
show_state: false
# Runs the action of the timer / tile / chip that was pressed (see the template).
tap_action:
  action: javascript
  javascript: |
    [[[ this.__assistTimerAct?.(); ]]]
styles:
  card:
    - padding: 12px 16px
  grid:
    - grid-template-areas: '"timers"'
    - grid-template-columns: 1fr
    - grid-template-rows: auto
  custom_fields:
    timers:
      - justify-self: stretch
      - width: 100%
custom_fields:
  timers: >
    [[[
      const htmlEscapes = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => htmlEscapes[c]);
      // UI language from Home Assistant; English for anything without a translation.
      const I18N = {
        en: { unavailable: 'Voice timers unavailable', stale: 'Voice timers: stale data', set: 'Set a timer',
              newTitle: 'New', newSub: 'timer', newRow: 'New timer', done: 'Done', dismiss: 'tap to dismiss',
              paused: 'paused', timer: 'Timer', minutes: 'Minutes', seconds: 'Seconds', satellite: 'Satellite',
              name: 'Name', cancel: 'Cancel', ok: 'Set' },
        fi: { unavailable: 'Puheajastimet: tila ei saatavilla', stale: 'Puheajastimet: vanhentunut tieto',
              set: 'Aseta ajastin', newTitle: 'Uusi', newSub: 'ajastin', newRow: 'Uusi ajastin', done: 'Valmis',
              dismiss: 'napauta kuitataksesi', paused: 'tauolla', timer: 'Ajastin', minutes: 'Minuutit',
              seconds: 'Sekunnit', satellite: 'Satelliitti', name: 'Nimi', cancel: 'Peruuta', ok: 'Aseta' },
      };
      const tr = (hs) => I18N[String(hs?.locale?.language || hs?.language || 'en').split('-')[0]] || I18N.en;
      const T = tr(hass);

      // Clicks: every timer, tile and chip says what it does in data-action. button-card
      // runs this template with `this` = the card element. It handles the click itself
      // (its own tap detection, also on touch screens) and does not let it through, so the
      // pressed item is remembered on pointerdown and tap_action calls __assistTimerAct.
      const card = this;
      if (card?.shadowRoot && !card.__assistTimerPress) {
        card.__assistTimerPress = true;
        card.shadowRoot.addEventListener('pointerdown', (ev) => {
          card.__assistTimerPressed = ev.composedPath().find((n) => n?.dataset?.action)?.dataset || null;
        }, true);
      }
      if (card) card.__assistTimerAct = () => {
          const pressed = card.__assistTimerPressed;
          card.__assistTimerPressed = null;
          if (!pressed) return;
          const h = card._hass;
          const L = tr(h);
          const { action, timerId, minutes } = pressed;
          const fields = h?.services?.script?.assist_timer_start?.fields || {};
          // Form for a new timer: a browser_mod popup that closes once the timer is set;
          // without browser_mod, the script's own form.
          const ask = (preset) => {
            const content = [
              { name: 'minutes', label: L.minutes, default: preset ?? 5,
                selector: { number: { min: 0, max: 600, mode: 'box', unit_of_measurement: 'min' } } },
              { name: 'seconds', label: L.seconds, default: 0,
                selector: { number: { min: 0, max: 59, mode: 'box', unit_of_measurement: 's' } } },
              { name: 'satellite', label: L.satellite, default: fields.satellite?.default,
                selector: fields.satellite?.selector || { device: {} } },
              { name: 'name', label: L.name, selector: { text: {} } },
            ];
            if (window.browser_mod?.showPopup) {
              window.browser_mod.showPopup({
                title: L.set, content, left_button: L.cancel, right_button: L.ok,
                right_button_action: (form) => h.callService('script', 'assist_timer_start', form),
              });
            } else {
              document.querySelector('home-assistant')?.dispatchEvent(new CustomEvent('hass-more-info', {
                bubbles: true, composed: true, detail: { entityId: 'script.assist_timer_start' },
              }));
            }
          };
          if (action === 'dismiss') h.callService('script', 'assist_timers_dismiss', {});
          else if (action === 'pause' || action === 'unpause') h.callService('assist_timer_ring', action, { timer_id: timerId });
          else if (action === 'quick') {
            const satellite = fields.satellite?.default;
            if (satellite) h.callService('script', 'assist_timer_start', { minutes: Number(minutes), satellite });
            else ask(Number(minutes));
          } else if (action === 'new') ask();
      };
      const css = `<style>
        .wrap { display: grid; gap: 14px; text-align: left; font-family: var(--ha-font-family-body, inherit); }
        .row { cursor: pointer; display: grid; grid-template-columns: 40px 1fr auto; column-gap: 12px; align-items: center; }
        .bubble { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
          color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }
        .bubble ha-icon { --mdc-icon-size: 22px; }
        .title { font-size: 15px; font-weight: 500; color: var(--primary-text-color);
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sub { font-size: 12px; color: var(--secondary-text-color); margin-top: 2px;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .time { font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: 0.5px;
          color: var(--accent); }
        .bar { grid-column: 2 / 4; height: 4px; border-radius: 2px; margin-top: 8px;
          background: var(--divider-color, rgba(127,127,127,0.25)); overflow: hidden; }
        .fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width 1s linear; }
        .row[data-state="running"] { --accent: var(--primary-color); }
        .row[data-state="ending"] { --accent: var(--warning-color, #ff9800); }
        .row[data-state="paused"] { --accent: var(--secondary-text-color); }
        .row[data-state="paused"] .time { opacity: 0.7; }
        .row[data-state="done"] { --accent: var(--success-color, #4caf50); }
        .row[data-state="done"] .bubble { animation: ring 1.2s ease-in-out infinite; }
        @keyframes ring { 0%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(-12deg); }
          20%, 40% { transform: rotate(12deg); } 50% { transform: rotate(0); } }
        .addrow { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px;
          color: var(--primary-color); padding-left: 52px; }
        .addrow ha-icon { --mdc-icon-size: 18px; }
        .note { display: flex; align-items: center; gap: 10px; color: var(--secondary-text-color); font-size: 15px; }
        .note ha-icon { --mdc-icon-size: 20px; opacity: 0.7; }
        .idle { display: flex; align-items: center; justify-content: space-between; gap: 10px 12px; flex-wrap: wrap;
          text-align: left;
          font-family: var(--ha-font-family-body, inherit); }
        .idle-main { display: flex; align-items: center; gap: 12px; cursor: pointer; min-width: 0; }
        .ibubble { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none;
          color: var(--primary-color); background: color-mix(in srgb, var(--primary-color) 18%, transparent); }
        .ibubble ha-icon { --mdc-icon-size: 22px; }
        .ititle { font-size: 15px; font-weight: 500; color: var(--primary-text-color); }
        .chips { display: flex; gap: 6px; }
        .chip { padding: 6px 12px; border-radius: 16px; font-size: 13px; font-weight: 500; cursor: pointer;
          color: var(--primary-color); background: color-mix(in srgb, var(--primary-color) 14%, transparent); }
      </style>`;
      const note = (icon, msg) => `${css}<div class="wrap"><div class="note"><ha-icon icon="${icon}"></ha-icon>${esc(msg)}</div></div>`;
      const idle = () => `${css}<div class="idle">
        <div class="idle-main" data-action="new">
          <div class="ibubble"><ha-icon icon="mdi:timer-plus-outline"></ha-icon></div>
          <div class="ititle">${esc(T.set)}</div>
        </div>
        <div class="chips">${[1, 5, 10].map((m) => `<div class="chip" data-action="quick" data-minutes="${m}">${m} min</div>`).join('')}</div>
      </div>`;

      const timers = entity?.attributes?.timers;
      if (!entity || entity.state === 'unavailable' || entity.state === 'unknown' || !Array.isArray(timers)) {
        return note('mdi:timer-alert-outline', T.unavailable);
      }
      // Tablet and HA clocks can differ by seconds. When a new poll arrives, the
      // gap between the tablet's clock and HA's last_updated is that offset.
      const serverTs = entity.last_updated ? new Date(entity.last_updated).getTime() : NaN;
      const sync = (globalThis.__assistTimersSync ||= { lastUpdated: null, offset: 0 });
      if (entity.last_updated !== sync.lastUpdated) {
        if (sync.lastUpdated !== null && Number.isFinite(serverTs)) sync.offset = Date.now() - serverTs;
        sync.lastUpdated = entity.last_updated;
      }
      const haNow = Date.now() - sync.offset;
      // Listed until the ring is dismissed on the satellite (the sensor decides).
      const done = states['sensor.assist_timers_finished']?.attributes?.finished || [];
      if (timers.length === 0 && done.length === 0) return idle();
      const age = Number.isFinite(serverTs) ? Math.max(0, (haNow - serverTs) / 1000) : 0;
      // Running timers change the attributes on every poll, so an old update means polling stopped.
      if (age > 60 && timers.some((t) => t.is_active)) return note('mdi:timer-alert-outline', T.stale);

      const clock = (total) => {
        const h = Math.floor(total / 3600);
        const m = Math.floor((total % 3600) / 60);
        const s = String(total % 60).padStart(2, '0');
        return h ? `${h}:${String(m).padStart(2, '0')}:${s}` : `${m}:${s}`;
      };
      const duration = (t) => {
        const parts = [];
        if (t.start_hours) parts.push(`${t.start_hours} h`);
        if (t.start_minutes) parts.push(`${t.start_minutes} min`);
        if (t.start_seconds) parts.push(`${t.start_seconds} s`);
        return parts.join(' ');
      };
      const total = (t) => (t.start_hours || 0) * 3600 + (t.start_minutes || 0) * 60 + (t.start_seconds || 0);
      // The satellite's room; its device name if it has no area.
      const place = (id) => {
        const device = hass?.devices?.[id];
        if (!device) return '';
        return hass?.areas?.[device.area_id]?.name || device.name_by_user || device.name || '';
      };
      const row = (state, icon, title, sub, right, progress, action, id) => `
        <div class="row" data-state="${state}" data-action="${action}"${id ? ` data-timer-id="${esc(id)}"` : ''}>
          <div class="bubble"><ha-icon icon="${icon}"></ha-icon></div>
          <div><div class="title">${esc(title)}</div><div class="sub">${esc(sub)}</div></div>
          <div class="time">${esc(right)}</div>
          ${progress === null ? '' : `<div class="bar"><div class="fill" style="width: ${progress.toFixed(1)}%"></div></div>`}
        </div><!--/row-->`;

      const doneRows = done.map((f) =>
        row('done', 'mdi:bell-ring', f.name || T.timer,
            [place(f.device_id), T.dismiss].filter(Boolean).join(' · '), T.done, null, 'dismiss'));
      const rows = timers
        .map((t) => ({ ...t, left: Math.max(0, Math.ceil(t.total_seconds_left - (t.is_active ? age : 0))) }))
        .sort((a, b) => a.left - b.left)
        .map((t) => {
          const state = !t.is_active ? 'paused' : t.left <= 10 ? 'ending' : 'running';
          const label = duration(t);
          const title = t.name || label || T.timer;
          const sub = [place(t.device_id), t.name ? label : '', t.is_active ? '' : T.paused].filter(Boolean).join(' · ');
          const full = total(t);
          const progress = full > 0 ? Math.min(100, (t.left / full) * 100) : null;
          return row(state, t.is_active ? 'mdi:timer-outline' : 'mdi:timer-pause-outline', title, sub, clock(t.left), progress,
            t.is_active ? 'pause' : 'unpause', t.id);
        });
      const addRow = `<div class="addrow" data-action="new"><ha-icon icon="mdi:plus"></ha-icon>${esc(T.newRow)}</div>`;
      return `${css}<div class="wrap">${[...doneRows, ...rows].join('')}${addRow}</div>`;
    ]]]
