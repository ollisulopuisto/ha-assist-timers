# Timers that ran out during the last minute (sensor.assist_timers_finished).
- type: custom:mushroom-template-badge
  entity: sensor.assist_timers_finished
  icon: mdi:timer-check-outline
  color: green
  label: >-
    {% set f = state_attr('sensor.assist_timers_finished', 'finished') or [] %}
    {% set ns = namespace(out=[]) %}{% for d in f | map(attribute='device_id') | select | unique %}
    {% set ns.out = ns.out + [area_name(d)] %}{% endfor %}
    {{ ns.out | select | unique | join(', ') }}
  content: >-
    {% set done_word = 'done' %}{# translate here, e.g. 'valmis' #}
    {% set f = state_attr('sensor.assist_timers_finished', 'finished') or [] %}
    {% set names = f | map(attribute='name') | select | join(', ') %}
    {{ names ~ ' ' ~ done_word if names else done_word | capitalize }}
  tap_action:
    action: perform-action
    perform_action: script.assist_timers_dismiss
  visibility:
    - condition: numeric_state
      entity: sensor.assist_timers_finished
      above: 0
